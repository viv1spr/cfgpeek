name: Настройки игроков (cs-config)
on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"
  push:
    paths:
      - "scripts/csconfig_fetch.py"
      - ".github/workflows/csconfig.yml"
permissions:
  contents: write
concurrency:
  group: csconfig
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать
        run: |
          python scripts/csconfig_fetch.py
      - name: Сохранить
        run: |
          git config user.name "cfgpeek-bot"
          git config user.email "cfgpeek-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "cs-config: обновление $(date -u +%F)" && git pull --rebase && git push)
