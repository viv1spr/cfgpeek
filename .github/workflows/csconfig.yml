name: Настройки игроков (cs-config)
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/csconfig_*.py"
      - ".github/workflows/csconfig.yml"
permissions:
  contents: write
concurrency:
  group: csconfig
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать
        run: |
          if [ -f scripts/csconfig_fetch.py ]; then python scripts/csconfig_fetch.py; else python scripts/csconfig_probe.py; fi
      - name: Сохранить
        run: |
          git config user.name "cfgpeek-bot"
          git config user.email "cfgpeek-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "cs-config: обновление $(date -u +%F)" && git pull --rebase && git push)
