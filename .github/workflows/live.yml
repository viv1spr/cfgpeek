name: Матчи команд (PandaScore)
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch_pandascore.py"
      - ".github/workflows/live.yml"
permissions:
  contents: write
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Скачать матчи
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
        run: python scripts/fetch_pandascore.py
      - name: Сохранить
        run: |
          git config user.name "cfgpeek-bot"
          git config user.email "cfgpeek-bot@users.noreply.github.com"
          git add data/live.json data/live_debug.json
          git diff --cached --quiet || (git commit -m "Матчи: обновление $(date -u +%F)" && git pull --rebase && git push)
